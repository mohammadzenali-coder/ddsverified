name: Regenerate static pages + Emalls feed

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "products_data.json"
      - "posts/**"
      - "tools/generate_emalls_feed.py"
      - "generate_pages.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generators
        run: |
          python tools/extract_products.py
          python generate_pages.py
          python tools/generate_emalls_feed.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: regenerate pages + emalls feed [skip ci]"
            git push
          fi
